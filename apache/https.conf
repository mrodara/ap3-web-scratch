<VirtualHost *:443>
    ServerName site-https.local
    DocumentRoot /var/www/https
    SSLEngine on
    SSLCertificateFile /etc/apache2/ssl/site-https.crt
    SSLCertificateKeyFile /etc/apache2/ssl/site-https.key
    <Directory /var/www/https>
        Options FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>
    ErrorLog ${APACHE_LOG_DIR}/https-error.log
    CustomLog ${APACHE_LOG_DIR}/https-access.log combined
</VirtualHost>
