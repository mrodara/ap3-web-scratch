<VirtualHost *:80>
    ServerName site-http.local
    DocumentRoot /var/www/http
    <Directory /var/www/http>
        Options FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>
    ErrorLog ${APACHE_LOG_DIR}/http-error.log
    CustomLog ${APACHE_LOG_DIR}/http-access.log combined
</VirtualHost>
